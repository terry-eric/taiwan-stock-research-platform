<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="index,follow">
  <meta name="theme-color" content="#0d2f58">
  <meta http-equiv="refresh" content="2;url=https://claw.terry878.org/">
  <title>台股全市場研究平台</title>
  <link rel="icon" href="icons/app-icon-192.png">
  <style>
    :root{color-scheme:light;--bg:#f6f7f2;--ink:#14202b;--muted:#64727a;--line:#dce2dc;--green:#1f7a5a;--navy:#0d2f58}
    *{box-sizing:border-box}
    body{display:grid;min-height:100vh;margin:0;place-items:center;padding:24px;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
    main{display:grid;width:min(560px,100%);gap:18px;border:1px solid var(--line);border-radius:14px;padding:28px;background:#fff;box-shadow:0 18px 45px rgba(29,37,43,.09)}
    img{width:88px;height:88px;border-radius:20px}
    h1{margin:0;font-size:clamp(1.8rem,7vw,2.8rem);line-height:1.12}
    p{margin:0;color:var(--muted);line-height:1.75}
    a{display:inline-flex;min-height:46px;align-items:center;justify-content:center;border-radius:8px;padding:10px 16px;background:var(--green);color:#fff;font-weight:900;text-decoration:none}
    small{color:var(--muted)}
  </style>
</head>
<body>
  <main>
    <img src="icons/app-icon-192.png" width="88" height="88" alt="台股研究平台圖示">
    <h1>台股全市場研究平台</h1>
    <p>正式服務由 Cloudflare Worker 與 D1 提供。GitHub Pages 不保存登入資料、管理權杖或後台 API。</p>
    <a href="https://claw.terry878.org/">進入研究平台</a>
    <small>即將自動前往正式網站。</small>
  </main>
  <script>window.setTimeout(() => window.location.replace("https://claw.terry878.org/"), 1200);</script>
</body>
</html>
