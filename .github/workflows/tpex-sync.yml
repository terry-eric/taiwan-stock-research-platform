name: TPEx official sync

on:
  schedule:
    # 18:20 Asia/Taipei, after the Worker’s TWSE-only 18:00 update.
    - cron: "20 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tpex-official-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Fetch TPEx official data and import changed rows
        env:
          WORKER_BASE_URL: https://claw.terry878.org
          TPEX_SYNC_TOKEN: ${{ secrets.TPEX_SYNC_TOKEN }}
        run: node scripts/sync-tpex-to-cloudflare.mjs
